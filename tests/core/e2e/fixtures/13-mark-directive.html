<h1 style="color: #1c1917; font-size: 22px; font-weight: 700; line-height: 1.4; margin: 0 0 16px; text-align: left">Mark Directive</h1>
<p style="color: #1c1917; font-size: 15px; font-weight: 400; line-height: 1.85; margin: 0 0 12px; text-align: left">正文中可以插入 <span style="background: #fff3cd; padding: 1px 3px; border-radius: 2px">高亮重点</span> 与 <span style="display: inline-block; background: #b94a3e; color: #fafaf9; font-size: 14px; padding: 1px 6px; border-radius: 3px; font-weight: bold; vertical-align: middle">NEW</span> 这类行内标记。</p>
<p style="color: #1c1917; font-size: 15px; font-weight: 400; line-height: 1.85; margin: 0 0 12px; text-align: left">也支持 <span style="text-decoration: underline">下划线</span> 和 <span style="text-emphasis: filled circle; text-emphasis-position: under left; -webkit-text-emphasis: filled circle">着重</span> 的混排表达。</p>
