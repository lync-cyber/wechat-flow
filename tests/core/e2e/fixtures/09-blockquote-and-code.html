<h2 style="color: #1c1917; font-size: 19px; font-weight: 700; line-height: 1.4; margin: 0 0 14px; text-align: left">Blockquote and Code Block</h2>
<blockquote style="background-color: #f3f0eb; border-left: 4px solid #2d5a4e; color: #44403c; font-style: italic; line-height: 1.85; margin: 0 0 12px; padding: 10px 16px">
<p style="color: #1c1917; font-size: 15px; font-weight: 400; line-height: 1.85; margin: 0 0 12px; text-align: left">This is a blockquote with some <strong style="color: #1c1917; font-weight: 600">bold</strong> text.</p>
<p style="color: #1c1917; font-size: 15px; font-weight: 400; line-height: 1.85; margin: 0 0 12px; text-align: left">A second line in the same blockquote.</p>
</blockquote>
<p style="color: #1c1917; font-size: 15px; font-weight: 400; line-height: 1.85; margin: 0 0 12px; text-align: left">Here is some inline <code style="background-color: #f0ede8; border-radius: 3px; color: #292524; font-size: 14px; padding: 2px 4px">code snippet</code> within a paragraph.</p>
<pre style="background-color: #f0ede8; border-radius: 6px; color: #292524; font-size: 14px; line-height: 1.6; margin: 0 0 12px; overflow: auto; padding: 12px 16px"><code style="background-color: #f0ede8; border-radius: 3px; color: #292524; font-size: 14px; padding: 2px 4px">function hello(name) {
  return `Hello, ${name}!`;
}
</code></pre>
<p style="color: #1c1917; font-size: 15px; font-weight: 400; line-height: 1.85; margin: 0 0 12px; text-align: left">Paragraph after the code block.</p>
